---
apiVersion: v1
kind: Service
metadata:
  name: mymart
  labels:
    app: mymart
spec:
  type: NodePort
  selector:
    app: mymart
  ports:
  - protocol: TCP
    port: 8080
    name: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mymart
spec:
  selector:
    matchLabels:
      app: mymart
  replicas: 1
  template:
    metadata:
      labels:
        app: mymart
    spec:
      containers:
      - name: mymart
        image: bhanuchandarreddy/mymart:latest
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          timeoutSeconds: 1
